<!DOCTYPE html>  
<html lang="zh">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>基于深度学习的网络谣言检测系统</title>  
    <style>  
        body {  
            font-family: Arial, sans-serif;  
            background-color: #f4f4f9;  
            margin: 0;  
            padding: 0;  
            height: 100vh;  
            display: flex;  
            flex-direction: column;  
            align-items: center;  
            justify-content: space-between;  
        }  

        .container {  
            background-image: url("https://i.postimg.cc/KzRM09gw/asda20241022132350.jpg");  
            border-radius: 8px;  
            box-shadow: 0 2px 10px rgba(137, 19, 19, 0.2);  
            width: 100%;  
            max-width: 1200px;  
            padding: 20px;  
            display: flex;  
            flex-direction: column;  
            gap: 20px;  
            margin-top: 20px;  
        }  

        .title {  
            text-align: center;  
            margin-bottom: 20px;  
        }  

        .input-container,  
        .result-container {  
            padding: 20px;  
            box-sizing: border-box;  
            background-color: rgba(255, 255, 255, 0.3);  
            backdrop-filter: blur(20px);  
            color: #333;  
            font-weight: 600;  
            border-radius: 8px;  
            display: flex;  
            flex-direction: column;  
            gap: 10px;  
        }  

        h1 {  
            color: #333;  
            letter-spacing: 0.2em;  
            margin: 0;  
        }  

        h2 {  
            color: #808485;  
            font-size: 0.9em;  
            margin: 5px 0;  
        }  

        h3 {  
            color: #333;  
            text-align: center;  
            letter-spacing: 0.2em;  
        }  

        textarea {  
            width: 100%;  
            height: 100px;  
            margin-bottom: 10px;  
            padding: 10px;  
            border: 1px solid #ddd;  
            border-radius: 5px;  
        }  

        .file-input-container {  
            display: flex;  
            align-items: center;  
            gap: 10px;  
        }  

        button {  
            background-color: #393737;  
            color: white;  
            padding: 8px 15px;  
            border: none;  
            border-radius: 5px;  
            cursor: pointer;  
            width: 60%;  
            align-self: center;  
        }  

        button:hover {  
            background-color: #979cb0;  
        }  

        .progress-container {  
            margin-top: 20px;  
            position: relative;  
        }  

        .progress-bar {  
            width: 0;  
            height: 10px;  
            background-color: #6eab6e;  
            text-align: center;  
            color: white;  
            position: relative;  
            border-radius: 8px;  
        }  

        .progress-text {  
            position: absolute;  
            width: 100%;  
            text-align: center;  
            line-height: 20px;  
            color: #333;  
        }  

        .info {  
            margin-top: 20px;  
            font-size: 0.9em;  
            color: #808485;  
            text-align: center;  
        }  

        .download-container {  
            margin-top: 20px;  
            text-align: center;  
        }  
    </style>  
</head>  

<body>  
    <div class="container">  
        <div class="title">  
            <h1>基于深度学习的网络谣言检测系统</h1>  
            <h2>Deep Learning Based Network Rumor Detection System</h2>  
        </div>  

        <div class="input-container">  
            <label for="textInput">输入文本：</label>  
            <textarea id="textInput" placeholder="请在此输入待分析的文本..."></textarea>  

            <div class="file-input-container">  
                <label for="fileInput">上传文件：</label>  
                <input type="file" id="fileInput" accept=".csv,.xlsx,.txt">  
            </div>  
            <div style="text-align:center;">  
                <button onclick="startDetection()">开始检测</button>  
            </div>  

            <div class="progress-container">  
                <div class="progress-bar" id="progressBar">  
                    <div class="progress-text" id="progressText">0%</div>  
                </div>  
            </div>  
        </div>  

        <div class="result-container">  
            <h3>检测结果</h3>  
            <div id="resultDisplay" style="text-align:center;">结果将在此处显示</div>  
            <div class="download-container">  
                <a id="downloadButton" style="display:none;" download="谣言检测结果.xlsx">下载结果</a>  
            </div>  
        </div>  
    </div>  

    <div class="info">  
        <p>系统优势：</p>  
        <p>时间序列特征，长距离依赖，模型持续学习，高效方便快捷</p>  
    </div>  

    <script>  
        async function startDetection() {  
            const progressBar = document.getElementById('progressBar');  
            const progressText = document.getElementById('progressText');  
            const resultDisplay = document.getElementById('resultDisplay');  
            const textInput = document.getElementById('textInput').value;  
            const fileInput = document.getElementById('fileInput').files[0];  
      
            resultDisplay.innerText = '';  
      
            let width = 0;  
            const interval = setInterval(() => {  
                if (width >= 100) {  
                    clearInterval(interval);  
                } else {  
                    width++;  
                    progressBar.style.width = width + '%';  
                    progressText.innerText = width + '%';  
                }  
            }, 20);  
      
            const formData = new FormData();  
            if (textInput) {  
                formData.append('text', textInput);  
            }  
            if (fileInput) {  
                formData.append('file', fileInput);  
            }  
      
            try {  
                const response = await fetch('/api/detect', {  
                    method: 'POST',  
                    body: formData  
                });  
                const result = await response.json();  
      
                if (result.downloadUrl) {  
                    document.getElementById('downloadButton').href = result.downloadUrl;  
                    document.getElementById('downloadButton').style.display = 'block';  
                    resultDisplay.innerText = '检测成功！请下载结果。';  
                } else if (result.message) {  
                    resultDisplay.innerText = result.message;  
                }  
            } catch (error) {  
                resultDisplay.innerText = '检测失败，请重试。';  
            }  
        }  
    </script>  
</body>  
</html>
